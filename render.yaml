services:
  - type: web
    name: dimension-composition-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Secrets: set these in the Render dashboard (Environment tab), never in this public file
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FTP_USER
        sync: false
      - key: FTP_PASS
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://dimensioncomposition.com
